<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI作文批改工具｜豆包API版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f4f7fa;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 24px;
            font-size: 26px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width:768px) {
            .row { grid-template-columns: 1fr; }
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px #00000012;
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom:12px;
            color:#334155;
        }
        textarea,input {
            width:100%;
            padding:14px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            font-size:15px;
            line-height:1.7;
        }
        textarea {
            min-height: 340px;
            resize: vertical;
        }
        .ctrl-bar {
            display:flex;
            gap:12px;
            margin:14px 0;
            flex-wrap:wrap;
            align-items:center;
        }
        select, button {
            padding:10px 14px;
            border-radius:8px;
            font-size:15px;
        }
        button {
            background: #2563eb;
            color:white;
            border:none;
            cursor:pointer;
            transition: 0.2s;
        }
        button:hover { background:#1d4ed8; }
        button:disabled {
            background:#94a3b8;
            cursor:not-allowed;
        }
        .result-box {
            line-height:1.8;
            font-size:15px;
            white-space: pre-wrap;
        }
        .api-row {
            margin-bottom:16px;
        }
        .tip {
            font-size:13px;
            color:#64748b;
            margin-top:4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 AI作文批改助手</h1>
        <div class="api-row card">
            <div class="title">🔑 豆包API配置</div>
            <input id="apiKey" placeholder="在这里填入你的豆包API Key">
            <div class="tip">密钥仅本地使用，不会上传到别的服务器</div>
        </div>
        <div class="row">
            <div class="card">
                <div class="title">📄 输入作文</div>
                <div class="ctrl-bar">
                    <span class="label">年级：</span>
                    <select id="grade">
                        <option value="小学">小学</option>
                        <option value="初中" selected>初中</option>
                        <option value="高中">高中</option>
                    </select>
                    <button id="runBtn" onclick="checkEssay()">AI批改</button>
                    <button onclick="clearAll()">清空</button>
                </div>
                <textarea id="essayInput" placeholder="粘贴作文……"></textarea>
            </div>
            <div class="card">
                <div class="title">✅ 批改结果</div>
                <div class="result-box" id="resultBox">等待批改</div>
            </div>
        </div>
    </div>

<script>
const API_URL = "https://ark.cn-beijing.volces.com/api/v3/chat/completions"

async function checkEssay(){
    const apiKey = document.getElementById("apiKey").value.trim()
    const essay = document.getElementById("essayInput").value.trim()
    const grade = document.getElementById("grade").value
    const resultBox = document.getElementById("resultBox")
    const runBtn = document.getElementById("runBtn")

    if(!apiKey){
        resultBox.textContent = "❌ 请先填写API Key"
        return
    }
    if(!essay){
        resultBox.textContent = "❌ 请输入作文"
        return
    }
    runBtn.disabled = true
    resultBox.textContent = "AI正在批改，请稍等……"

    const prompt = `你是专业作文老师，针对${grade}作文批改。
请按下面固定格式输出：
【得分】满分100
【优点】
【问题】
【修改建议】
【润色完整版】
作文原文：
${essay}`

    try{
        const res = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization": `Bearer ${apiKey}`
            },
            body:JSON.stringify({
                model:"ep-20241222143141-xxx", // 替换成你的模型ID
                messages:[{"role":"user","content":prompt}],
                temperature:0.7
            })
        })
        const data = await res.json()
        if(data.error){
            resultBox.textContent = `错误：${data.error.message}`
        }else{
            resultBox.textContent = data.choices[0].message.content
        }
    }catch(e){
        resultBox.textContent = "请求失败：" + e.message
    }
    runBtn.disabled = false
}

function clearAll(){
    document.getElementById("essayInput").value = ""
    document.getElementById("resultBox").innerText = "等待批改"
}
</script>
</body>
</html>
